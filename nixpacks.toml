[phases.setup]
nixPkgs = ['nodejs_20', 'ruby_3_4', 'postgresql', 'libyaml']

[phases.install]
cmds = [
  'mkdir -p log tmp/pids tmp/cache',
  'bundle config set --local deployment true',
  'bundle config set --local without development:test',
  'bundle install',
  'pnpm install --frozen-lockfile'
]

[phases.build]
cmds = [
  'bundle exec bootsnap precompile --gemfile',
  'SECRET_KEY_BASE=$(openssl rand -hex 64) DEVISE_SECRET_KEY=$(openssl rand -hex 64) RAILS_ENV=production DATABASE_URL=postgresql://localhost/precompile bundle exec rake assets:precompile'
]

[start]
cmd = 'bundle exec rails db:migrate && bundle exec rails server -b 0.0.0.0 -p $PORT'
